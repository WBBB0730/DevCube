allowBuilds:
  '@parcel/watcher': true
  '@vscode/ripgrep': true
  electron: true
  esbuild: true
  node-pty: true
  # 包里自带各平台的 N-API 预编译文件，加载时优先用它们；按 Electron 准备原生模块由 postinstall 的
  # install-app-deps 负责。装依赖时这一步编出的是给 Node 的，用不上，在 Windows 上还会因找不到编译器失败
  better-sqlite3: false
  ssh2: false

overrides:
  ssh2>cpu-features: '-'

patchedDependencies:
  '@aiden0z/pptx-renderer@1.3.0': patches/@aiden0z__pptx-renderer@1.3.0.patch
  '@extend-ai/react-xlsx@0.16.5': patches/@extend-ai__react-xlsx@0.16.5.patch
  '@base-ui-components/react@1.0.0-rc.0': patches/@base-ui-components__react@1.0.0-rc.0.patch
  '@codemirror/lang-sql@6.10.0': patches/@codemirror__lang-sql@6.10.0.patch
